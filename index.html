      <main

    <button
      id="back-to-top"
      class="fixed bottom-6 right-6 sm:bottom-8 sm:right-8 bg-blue-600 text-white w-10 h-10 sm:w-12 sm:h-12 rounded-full shadow-lg shadow-blue-500/30 opacity-0 pointer-events-none transform translate-y-4 transition-all duration-300 hover:bg-blue-700 hover:-translate-y-1 z-50 flex items-center justify-center focus:outline-none"
    >
      <i class="fa-solid fa-arrow-up text-sm sm:text-base"></i>
    </button>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script>
      function toggleDropdown() {
        const menu = document.getElementById('dropdown-menu');
        const icon = document.getElementById('dropdown-icon');

        if (menu.classList.contains('hidden')) {
          menu.classList.remove('hidden');
          menu.classList.add('flex');
          icon.classList.add('rotate-180');
        } else {
          menu.classList.add('hidden');
          menu.classList.remove('flex');
          icon.classList.remove('rotate-180');
        }
      }

      window.addEventListener('click', function (e) {
        const btn = document.getElementById('dropdown-btn');
        const menu = document.getElementById('dropdown-menu');

        if (
          btn &&
          menu &&
          !btn.contains(e.target) &&
          !menu.contains(e.target)
        ) {
          menu.classList.add('hidden');
          menu.classList.remove('flex');
          document
            .getElementById('dropdown-icon')
            .classList.remove('rotate-180');
        }
      });

      async function loadContent(url) {
        const container = document.getElementById('content-container');

        container.innerHTML = `
          <div class="flex flex-col justify-center items-center h-64 text-gray-400">
            <i class="fa-solid fa-circle-notch fa-spin text-3xl sm:text-4xl text-blue-500 mb-4"></i>
            <p class="text-sm font-medium animate-pulse">Menyiapkan materi...</p>
          </div>
        `;

        try {
          await new Promise((resolve) => setTimeout(resolve, 400));
          const response = await fetch(url);
          if (!response.ok) throw new Error('Gagal mengambil data');

          container.innerHTML = await response.text();
        } catch (error) {
          container.innerHTML = `<div class="p-6 sm:p-8 text-center bg-red-50 rounded-2xl border border-red-100 text-red-600 text-sm sm:text-base shadow-sm"><i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i><br>Gagal memuat file tugas. Pastikan file berada di dalam folder "content".</div>`;
        }
      }

      function selectTask(tabName, label, iconClass) {
        document.getElementById('dropdown-label').innerHTML =
          `<i class="fa-solid ${iconClass} mr-2"></i> ${label}`;

        toggleDropdown();
        loadContent(`./content/${tabName}.html`);

        const containerTop =
          document.getElementById('content-container').offsetTop;
        window.scrollTo({ top: containerTop - 120, behavior: 'smooth' });
      }

      function setDynamicGreeting() {
        const hour = new Date().getHours();
        let greeting = 'Halo';
        if (hour >= 4 && hour < 11) greeting = 'Selamat Pagi';
        else if (hour >= 11 && hour < 15) greeting = 'Selamat Siang';
        else if (hour >= 15 && hour < 18) greeting = 'Selamat Sore';
        else greeting = 'Selamat Malam';
        document.getElementById('dynamic-greeting').textContent = greeting;
      }

      document.addEventListener('DOMContentLoaded', () => {
        setDynamicGreeting();

        AOS.init({
          duration: 800,
          easing: 'ease-out-cubic',
          once: true,
        });
      });

      window.addEventListener('scroll', () => {
        const winScroll =
          document.body.scrollTop || document.documentElement.scrollTop;
        const bttButton = document.getElementById('back-to-top');

        if (winScroll > 300) {
          bttButton.classList.remove(
            'opacity-0',
            'pointer-events-none',
            'translate-y-4',
          );
          bttButton.classList.add('opacity-100', 'translate-y-0');
        } else {
          bttButton.classList.add(
            'opacity-0',
            'pointer-events-none',
            'translate-y-4',
          );
          bttButton.classList.remove('opacity-100', 'translate-y-0');
        }
      });

      document.getElementById('back-to-top').addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    </script>
